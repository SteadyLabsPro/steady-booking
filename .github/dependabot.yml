# Dependabot: automated dependency + security-vulnerability update PRs.
# Security fixes are also raised automatically by GitHub's security updates.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Group routine minor/patch bumps into one PR to cut noise; majors stay separate.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
